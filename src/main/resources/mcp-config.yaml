# MCP Tools and Resources Configuration
# This file defines the tools and resources exposed by the Loxone MCP server

tools:
  # Basic device control
  - name: control_device
    description: |
      Controls a specific Loxone device by its UUID.
      Supports actions like on, off, toggle, up, down, stop.
    parameters:
      - name: device_id
        type: string
        description: The UUID of the device to control
        required: true
      - name: action
        type: string
        description: Action to perform (on, off, toggle, up, down, stop)
        required: true
        enum: [ "on", "off", "toggle", "up", "down", "stop" ]
      - name: value
        type: number
        description: Optional value for the action (e.g., brightness level, position)
        required: false
    handler:
      type: control_device

  # Room-based control
  - name: control_devices_by_room
    description: |
      Controls all devices of a specific type in a room.
      Useful for "turn off all lights in the kitchen" type commands.
    parameters:
      - name: room
        type: string
        description: Name of the room (e.g., "Kitchen", "Living Room")
        required: true
      - name: action
        type: string
        description: Action to perform on all devices
        required: true
        enum: [ "on", "off", "up", "down", "stop" ]
      - name: device_type
        type: string
        description: Optional device type filter (e.g., "Switch", "Dimmer", "Jalousie")
        required: false
    handler:
      type: control_devices_by_room

  # Type-based control
  - name: control_devices_by_type
    description: |
      Controls all devices of a specific type across the entire system.
      For example, "turn off all lights" or "close all blinds".
    parameters:
      - name: device_type
        type: string
        description: Type of devices to control (e.g., "Switch", "Dimmer", "Jalousie")
        required: true
      - name: action
        type: string
        description: Action to perform on all matching devices
        required: true
        enum: [ "on", "off", "up", "down", "stop" ]
    handler:
      type: control_devices_by_type

  # Category-based control
  - name: control_devices_by_category
    description: |
      Controls all devices in a specific category (e.g., lighting, blinds).
      Categories group related devices across different rooms.
    parameters:
      - name: category
        type: string
        description: Category name (use the structure resource to see available categories)
        required: true
      - name: action
        type: string
        description: Action to perform on all devices in the category
        required: true
        enum: [ "on", "off", "up", "down", "stop" ]
    handler:
      type: control_devices_by_category

  # Generic control command - allows building complex Loxone commands
  - name: send_control_command
    description: |
      Send a command to a device by UUID.
      This is a flexible tool that supports any Loxone command.
      
      Examples:
      - Basic: control="uuid", action="On" or "Off"
      - Dimmer: control="uuid", action="50" (brightness 0-100)
      - Blinds: control="uuid", action="FullUp" or "FullDown"
      - Complex: Any valid Loxone command path
    parameters:
      - name: control
        type: string
        description: The UUID of the control to target
        required: true
      - name: action
        type: string
        description: The action/command to send (e.g., "On", "Off", "50", "FullUp")
        required: true
    handler:
      type: generic_command
      commandTemplate: "/jdev/sps/io/{control}/{action}"

resources:
  # Structure summary
  - uri: loxone://structure/summary
    name: Loxone Structure Summary
    description: |
      Overview of the entire Loxone system structure.
      Shows counts and lists of all rooms, devices, and categories.
      Start here to understand what's available in the system.
    mimeType: application/json
    handler:
      type: structure_summary

  # All rooms
  - uri: loxone://rooms
    name: All Rooms
    description: |
      List of all rooms in the Loxone system.
      Each room includes its UUID, name, and device count.
    mimeType: application/json
    handler:
      type: rooms_list

  # Room devices (pattern-based URI)
  - uri: loxone://rooms/{roomName}/devices
    name: Room Devices
    description: |
      List all devices in a specific room.
      Replace {roomName} with the actual room name from the rooms list.
      Example: loxone://rooms/Kitchen/devices
    mimeType: application/json
    handler:
      type: room_devices

  # All devices
  - uri: loxone://devices/all
    name: All Devices
    description: |
      Complete list of all devices in the system.
      Includes UUID, name, type, room, and category for each device.
    mimeType: application/json
    handler:
      type: devices_all

  # Devices by type (pattern-based URI)
  - uri: loxone://devices/type/{deviceType}
    name: Devices by Type
    description: |
      List all devices of a specific type.
      Common types: Switch, Dimmer, Jalousie, IRoomControllerV2, AnalogInput
      Example: loxone://devices/type/Switch
    mimeType: application/json
    handler:
      type: devices_by_type

  # Devices by category (pattern-based URI)
  - uri: loxone://devices/category/{categoryName}
    name: Devices by Category
    description: |
      List all devices in a specific category.
      Use the categories list resource to see available categories.
      Example: loxone://devices/category/Lights
    mimeType: application/json
    handler:
      type: devices_by_category

  # All categories
  - uri: loxone://categories
    name: All Categories
    description: |
      List of all categories in the Loxone system.
      Categories group related devices (lights, blinds, climate, etc.)
    mimeType: application/json
    handler:
      type: categories_list

  # Structure file - list of all object types
  - uri: loxone://structure-file/objects
    name: Structure File Objects
    description: |
      List of all Loxone object types from the official structure file.
      Each object type (e.g., Hourcounter, InfoOnlyAnalog) has states, commands, and details.
      Use this to understand what data is available for different device types.
    mimeType: application/json
    handler:
      type: structure_file_list

  # Structure file - specific object details
  - uri: loxone://structure-file/object/{objectName}
    name: Structure File Object Details
    description: |
      Detailed information about a specific Loxone object type.
      Shows all states (data fields), commands, and configuration details.
      Replace {objectName} with the object type name (e.g., Hourcounter, InfoOnlyAnalog).
      Example: loxone://structure-file/object/Hourcounter
    mimeType: application/json
    handler:
      type: structure_file_object

  # Device states - all devices with optional filtering
  - uri: loxone://devices/states
    name: All Device States
    description: |
      Get current state values for all devices in the Loxone system.
      Returns real-time state information like temperatures, switch states, positions, etc.
      
      Optional query parameters:
        - ?filter=<name> - Filter devices by name (case-insensitive)
        - ?room=<roomName> - Filter devices by room name
        - ?type=<deviceType> - Filter devices by type
        - ?category=<categoryName> - Filter devices by category
      
      Examples:
        - loxone://devices/states - Get all device states
        - loxone://devices/states?filter=kitchen - Devices with "kitchen" in name
        - loxone://devices/states?room=Kitchen - All devices in Kitchen room
        - loxone://devices/states?type=Switch - All Switch type devices
    mimeType: application/json
    handler:
      type: all_device_states

  # Single device state by UUID
  - uri: loxone://devices/{deviceUuid}/state
    name: Device State
    description: |
      Get current state values for a specific device by its UUID.
      Returns all state values for the device (temperature, position, active status, etc.)
      
      Common state names by device type:
        - Switch: active (0=off, 1=on)
        - Dimmer: position (0-100), active (0/1)
        - IRoomControllerV2: tempActual, tempTarget, mode
        - Jalousie: position, shadePosition
        - Alarm: armed, armedDelay, triggered
      
      Replace {deviceUuid} with the device UUID from the devices list.
      Example: loxone://devices/12345678-1234-1234-1234-123456789abc/state
    mimeType: application/json
    handler:
      type: device_state

