# MCP Tools and Resources Configuration
# This file defines the tools and resources exposed by the Loxone MCP server

tools:
  # Basic device control
  - name: control_device
    description: |
      Controls a specific Loxone device by its UUID.
      Supports actions like on, off, toggle, up, down, stop.
    parameters:
      - name: device_id
        type: string
        description: The UUID of the device to control
        required: true
      - name: action
        type: string
        description: Action to perform (on, off, toggle, up, down, stop)
        required: true
        enum: [ "on", "off", "toggle", "up", "down", "stop" ]
      - name: value
        type: number
        description: Optional value for the action (e.g., brightness level, position)
        required: false
    handler:
      type: control_device

  # Room-based control
  - name: control_devices_by_room
    description: |
      Controls all devices of a specific type in a room.
      Useful for "turn off all lights in the kitchen" type commands.
    parameters:
      - name: room
        type: string
        description: Name of the room (e.g., "Kitchen", "Living Room")
        required: true
      - name: action
        type: string
        description: Action to perform on all devices
        required: true
        enum: [ "on", "off", "up", "down", "stop" ]
      - name: device_type
        type: string
        description: Optional device type filter (e.g., "Switch", "Dimmer", "Jalousie")
        required: false
      - name: include_states
        type: boolean
        description: If true, include current state values for each device in the response
        required: false
        default: false
    handler:
      type: control_devices_by_room

  # Type-based control
  - name: control_devices_by_type
    description: |
      Controls all devices of a specific type across the entire system.
      For example, "turn off all lights" or "close all blinds".
    parameters:
      - name: device_type
        type: string
        description: Type of devices to control (e.g., "Switch", "Dimmer", "Jalousie")
        required: true
      - name: action
        type: string
        description: Action to perform on all matching devices
        required: true
        enum: [ "on", "off", "up", "down", "stop" ]
      - name: include_states
        type: boolean
        description: If true, include current state values for each device in the response
        required: false
        default: false
    handler:
      type: control_devices_by_type

  # Category-based control
  - name: control_devices_by_category
    description: |
      Controls all devices in a specific category (e.g., lighting, blinds).
      Categories group related devices across different rooms.
    parameters:
      - name: category
        type: string
        description: Category name (use the structure resource to see available categories)
        required: true
      - name: action
        type: string
        description: Action to perform on all devices in the category
        required: true
        enum: [ "on", "off", "up", "down", "stop" ]
      - name: include_states
        type: boolean
        description: If true, include current state values for each device in the response
        required: false
        default: false
    handler:
      type: control_devices_by_category

  # Generic control command - allows building complex Loxone commands
  - name: send_control_command
    description: |
      Send a command to a device by UUID.
      This is a flexible tool that supports any Loxone command.
      
      Examples:
      - Basic: control="uuid", action="On" or "Off"
      - Dimmer: control="uuid", action="50" (brightness 0-100)
      - Blinds: control="uuid", action="FullUp" or "FullDown"
      - Complex: Any valid Loxone command path
    parameters:
      - name: control
        type: string
        description: The UUID of the control to target
        required: true
      - name: action
        type: string
        description: The action/command to send (e.g., "On", "Off", "50", "FullUp")
        required: true
    handler:
      type: generic_command
      commandTemplate: "/jdev/sps/io/{control}/{action}"

resources:
  # Structure summary
  - uri: loxone://structure/summary
    name: Loxone Structure Summary
    description: |
      Overview of the entire Loxone system structure.
      Shows counts and lists of all rooms, devices, and categories.
      Start here to understand what's available in the system.
    mimeType: application/json
    handler:
      type: structure_summary

  # All rooms
  - uri: loxone://rooms
    name: All Rooms
    description: |
      List of all rooms in the Loxone system.
      Each room includes its UUID, name, and device count.
    mimeType: application/json
    handler:
      type: rooms_list

  # Room devices (pattern-based URI)
  - uri: loxone://rooms/{roomName}/devices
    name: Room Devices
    description: |
      List all devices in a specific room.
      Replace {roomName} with the actual room name from the rooms list.
      Example: loxone://rooms/Kitchen/devices
    mimeType: application/json
    handler:
      type: room_devices

  # All devices
  - uri: loxone://devices/all
    name: All Devices
    description: |
      Complete list of all devices in the system.
      Includes UUID, name, type, room, and category for each device.
    mimeType: application/json
    handler:
      type: devices_all

  # Devices by type (pattern-based URI)
  - uri: loxone://devices/type/{deviceType}
    name: Devices by Type
    description: |
      List all devices of a specific type.
      Common types: Switch, Dimmer, Jalousie, IRoomControllerV2, AnalogInput
      Example: loxone://devices/type/Switch
    mimeType: application/json
    handler:
      type: devices_by_type

  # Devices by category (pattern-based URI)
  - uri: loxone://devices/category/{categoryName}
    name: Devices by Category
    description: |
      List all devices in a specific category.
      Use the categories list resource to see available categories.
      Example: loxone://devices/category/Lights
    mimeType: application/json
    handler:
      type: devices_by_category

  # All categories
  - uri: loxone://categories
    name: All Categories
    description: |
      List of all categories in the Loxone system.
      Categories group related devices (lights, blinds, climate, etc.)
    mimeType: application/json
    handler:
      type: categories_list

  # Loxone docs - Table of Contents
  - uri: loxone://docs
    name: Loxone Docs - Table of Contents
    description: |
      Table of Contents for the Loxone Structure File documentation.
      Lists all top-level sections: general topics (rooms, globalStates, msInfo, etc.)
      and all control types (Switch, Dimmer, Jalousie, etc.).

      Each entry includes a `detailUri` field — use that URI to read the full documentation
      for that topic. Think of this as a clickable TOC:
        - General sections → loxone://docs/topic/{name}  (e.g. loxone://docs/topic/rooms)
        - Control types    → loxone://docs/topic/{name}  (e.g. loxone://docs/topic/Switch)

      Start here to discover what documentation is available.
    mimeType: application/json
    handler:
      type: docs_toc

  # Loxone docs - flat list of all control types
  - uri: loxone://docs/controls
    name: Loxone Docs - All Controls
    description: |
      Flat list of every control type documented in the Loxone Structure File,
      including nested sub-controls (e.g. "BMW Wallbox specific" under "CarCharger").

      Each entry includes:
        - name: the control type name
        - description: brief description
        - detailsCount / statesCount / commandsCount: how much data is available
        - detailUri: use this URI to read the full documentation for that control

      Use this when you know you're looking for a control type and want to scan all options.
      Example: loxone://docs/topic/SteakThermo
    mimeType: application/json
    handler:
      type: docs_controls

  # Loxone docs - topic detail (controls and general sections)
  - uri: loxone://docs/topic/{name}
    name: Loxone Docs - Topic Detail
    description: |
      Full documentation for a named topic — works for both control types and general sections.

      For control types (e.g. Switch, Dimmer, SteakThermo):
        Returns details, states, and commands with full descriptions and enum values.

      For general sections (e.g. rooms, globalStates, msInfo):
        Returns field descriptions and nested sub-sections.

      Replace {name} with the exact name from the Table of Contents or controls list.
      Examples:
        - loxone://docs/topic/Switch
        - loxone://docs/topic/rooms
        - loxone://docs/topic/SteakThermo
        - loxone://docs/topic/Jalousie
    mimeType: application/json
    handler:
      type: docs_topic

  # Device states - all devices with optional filtering
  - uri: loxone://devices/states
    name: All Device States
    description: |
      Get current state values for all devices in the Loxone system.
      Returns real-time state information like temperatures, switch states, positions, etc.
      
      Optional query parameters:
        - ?filter=<name> - Filter devices by name (case-insensitive)
        - ?room=<roomName> - Filter devices by room name
        - ?type=<deviceType> - Filter devices by type
        - ?category=<categoryName> - Filter devices by category
      
      Examples:
        - loxone://devices/states - Get all device states
        - loxone://devices/states?filter=kitchen - Devices with "kitchen" in name
        - loxone://devices/states?room=Kitchen - All devices in Kitchen room
        - loxone://devices/states?type=Switch - All Switch type devices
    mimeType: application/json
    handler:
      type: all_device_states

  # Single device state by UUID
  - uri: loxone://devices/{deviceUuid}/state
    name: Device State
    description: |
      Get current state values for a specific device by its UUID.
      Returns all state values for the device (temperature, position, active status, etc.)
      
      Common state names by device type:
        - Switch: active (0=off, 1=on)
        - Dimmer: position (0-100), active (0/1)
        - IRoomControllerV2: tempActual, tempTarget, mode
        - Jalousie: position, shadePosition
        - Alarm: armed, armedDelay, triggered
      
      Replace {deviceUuid} with the device UUID from the devices list.
      Example: loxone://devices/12345678-1234-1234-1234-123456789abc/state
    mimeType: application/json
    handler:
      type: device_state

  # Statistics — one or more controls, arbitrary time range
  - uri: loxone://statistics
    name: Device Statistics
    description: |
      Fetch historical statistics for one or more Loxone controls.

      Query parameters (all repeatable to query multiple controls in one request):
        - uuid   (required, repeatable) — UUID of the control (uuidAction from the devices list)
        - from   (required, repeatable) — start of time range as ISO 8601 string (e.g. 2024-11-15T00:00:00Z)
        - to     (required, repeatable) — end of time range as ISO 8601 string (e.g. 2024-11-22T00:00:00Z)
        - unit   (optional, once)       — aggregation resolution for V2 controls:
                                          ALL | HOUR | DAY | MONTH | YEAR  (default: DAY)

      The i-th uuid is paired with the i-th from and to, so every uuid must have
      exactly one corresponding from and to value.

      V1 controls use the Loxone epoch (2009-01-01) for their timestamps;
      from/to are still supplied as ISO 8601 strings and handled automatically.

      Examples:
        - Single control, last 7 days:
            loxone://statistics?uuid=abc123&from=2025-02-16T00:00:00Z&to=2025-02-23T00:00:00Z

        - Two controls, same window, monthly aggregation:
            loxone://statistics?uuid=abc123&from=2025-01-01T00:00:00Z&to=2025-02-23T00:00:00Z&uuid=def456&from=2025-01-01T00:00:00Z&to=2025-02-23T00:00:00Z&unit=MONTH

      Each entry in the returned array contains:
        - uuid, name, type
        - statisticVersion: "v1" or "v2"
        - unit: the aggregation unit used
        - entryCount: number of data points returned
        - labels: output/data-point names for value columns
        - entries: array of { timestamp, values[] }
    mimeType: application/json
    handler:
      type: statistics
