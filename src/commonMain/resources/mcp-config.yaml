tools:
  - name: operate_control
    description: Send a command to a specific Loxone control by its UUID
    parameters:
      - name: control_id
        type: string
        description: The UUID of the control to operate
        required: true
      - name: action
        type: string
        description: Action to perform
        required: true
        enum: ["on", "off", "toggle", "up", "down", "stop"]
      - name: value
        type: number
        description: Optional value for the action
        required: false
    handler:
      type: operate_control

  - name: operate_controls_by_room
    description: Send a command to all Loxone controls of a specific type in a room
    parameters:
      - name: room
        type: string
        description: Name of the room
        required: true
      - name: action
        type: string
        description: Action to perform on all controls
        required: true
        enum: ["on", "off", "up", "down", "stop"]
      - name: control_type
        type: string
        description: Optional control type filter (e.g. LightController, Jalousie)
        required: false
      - name: include_states
        type: boolean
        description: Include current state values in the response
        required: false
        default: false
    handler:
      type: operate_controls_by_room

  - name: operate_controls_by_type
    description: Send a command to all Loxone controls of a specific type
    parameters:
      - name: control_type
        type: string
        description: Type of controls to operate (e.g. LightController, Jalousie)
        required: true
      - name: action
        type: string
        description: Action to perform
        required: true
        enum: ["on", "off", "up", "down", "stop"]
      - name: include_states
        type: boolean
        description: Include current state values in the response
        required: false
        default: false
    handler:
      type: operate_controls_by_type

  - name: operate_controls_by_category
    description: Send a command to all Loxone controls in a specific category
    parameters:
      - name: category
        type: string
        description: Category name
        required: true
      - name: action
        type: string
        description: Action to perform
        required: true
        enum: ["on", "off", "up", "down", "stop"]
      - name: include_states
        type: boolean
        description: Include current state values in the response
        required: false
        default: false
    handler:
      type: operate_controls_by_category

  - name: send_control_command
    description: Send a raw command to a Loxone control by UUID
    parameters:
      - name: control
        type: string
        description: The UUID of the control to target
        required: true
      - name: action
        type: string
        description: The action or command to send
        required: true
    handler:
      type: generic_command
      commandTemplate: "/jdev/sps/io/{control}/{action}"

  - name: send_miniserver_command
    description: >
      Send any raw HTTP GET command to the Loxone Miniserver and return the response.
      WARNING: Some endpoints can trigger destructive actions (reboot, config changes, file operations).
      Use only for diagnostics and only when explicitly requested by the user.
      See loxone://webservices for the full list of available paths.
      Examples: "dev/sps/state", "dev/sys/cpu", "dev/sys/heap", "dev/cfg/version",
      "dev/sps/enumdev", "data/status", "stats"
      DANGEROUS paths (require explicit user confirmation before calling):
      "dev/sys/reboot" — reboots the Miniserver, disconnects all clients;
      "dev/sps/restart" — restarts the PLC, all controls temporarily unavailable.
    parameters:
      - name: path
        type: string
        description: >
          The Miniserver API path to call (without leading slash).
          E.g. "dev/sps/state", "dev/sys/cpu", "dev/fsget/log/def.log"
        required: true
    handler:
      type: generic_command
      commandTemplate: "{path}"

resources:
  - uri: "loxone://structure/summary"
    name: Loxone Structure Summary
    description: Overview of the entire Loxone system structure including control and room counts
    mimeType: application/json
    handler:
      type: structure_summary

  - uri: "loxone://rooms"
    name: All Rooms
    description: List of all rooms in the Loxone system
    mimeType: application/json
    handler:
      type: rooms_list

  - uri: "loxone://rooms/{roomName}/controls"
    name: Room Controls
    description: List all Loxone controls in a specific room
    mimeType: application/json
    handler:
      type: room_devices

  - uri: "loxone://controls/all"
    name: All Controls
    description: Complete list of all Loxone controls in the system
    mimeType: application/json
    handler:
      type: devices_all

  - uri: "loxone://controls/type/{deviceType}"
    name: Controls by Type
    description: List all Loxone controls of a specific type
    mimeType: application/json
    handler:
      type: devices_by_type

  - uri: "loxone://controls/category/{categoryName}"
    name: Controls by Category
    description: List all Loxone controls in a specific category
    mimeType: application/json
    handler:
      type: devices_by_category

  - uri: "loxone://categories"
    name: All Categories
    description: List of all categories in the Loxone system
    mimeType: application/json
    handler:
      type: categories_list

  - uri: "loxone://docs"
    name: Loxone Docs TOC
    description: Table of Contents for the Loxone Structure File documentation
    mimeType: application/json
    handler:
      type: docs_toc

  - uri: "loxone://docs/controls"
    name: Loxone Docs Controls
    description: Flat list of every control type documented
    mimeType: application/json
    handler:
      type: docs_controls

  - uri: "loxone://docs/topic/{name}"
    name: Loxone Docs Topic
    description: Full documentation for a named topic
    mimeType: application/json
    handler:
      type: docs_topic

  - uri: "loxone://controls/states"
    name: All Control States
    description: Get current state values for all Loxone controls
    mimeType: application/json
    handler:
      type: all_device_states

  - uri: "loxone://controls/{deviceUuid}/state"
    name: Control State
    description: Get current state values for a specific Loxone control
    mimeType: application/json
    handler:
      type: device_state

  - uri: "loxone://statistics"
    name: Control Statistics
    description: Fetch historical statistics for one or more Loxone controls
    mimeType: application/json
    handler:
      type: statistics

  - uri: "loxone://webservices"
    name: Loxone Webservices
    description: Available Loxone Miniserver HTTP API webservice commands organized by category
    mimeType: application/json
    handler:
      type: webservices

  - uri: "loxone://docs/diagnostic-scenarios"
    name: Diagnostic Scenarios
    description: >
      Step-by-step diagnostic workflows for common Loxone troubleshooting scenarios.
      Each scenario lists symptoms, the sequence of API calls to make, and how to
      interpret the results. Use this as a guide when something seems wrong with the
      Miniserver, a control, or a connected device.
    mimeType: application/json
    handler:
      type: diagnostic_scenarios

  - uri: "loxone://system/log"
    name: System Log
    description: >
      Tail of the Miniserver system log (def.log from the SD card).
      Useful for diagnosing errors, warnings, and recent events.
      Append ?lines=N to limit output (default: 200 lines).
    mimeType: text/plain
    handler:
      type: system_log

  - uri: "loxone://controls/with-statistics"
    name: Controls with Statistics
    description: >
      List of all Loxone controls that have statistics configured (v1 or v2).
      Use this to discover which controls you can query via loxone://statistics.
      Each entry shows the control UUID, name, type, room, and statistic version.
    mimeType: application/json
    handler:
      type: devices_with_statistics

  - uri: "loxone://system/status"
    name: System Status
    description: >
      Aggregated read-only health snapshot of the Miniserver.
      Calls dev/sps/state, dev/sys/cpu, dev/sys/heap, dev/sps/status,
      dev/cfg/version, dev/sys/time, dev/cfg/ip, dev/cfg/dns1, dev/cfg/ntp
      and returns structured JSON with parsed values and health flags.
      Use this as the first step in any diagnostic workflow before reaching
      for the send_miniserver_command tool.
    mimeType: application/json
    handler:
      type: system_status

  - uri: "loxone://devices"
    name: Physical Devices
    description: >
      List physical Loxone hardware devices: Miniserver, Extensions, Tree devices, Air devices, and network peripherals.
      Supports query parameters: ?name=, ?serial=, ?version=, ?type=, ?online_only=true.
      Use to check which hardware is online or offline and inspect firmware versions.
    mimeType: application/json
    handler:
      type: physical_devices

  - uri: "loxone://system/stats"
    name: System Statistics
    description: >
      Raw Miniserver system statistics (stats endpoint).
      Returns performance counters and system load history.
      Useful for investigating recurring high CPU or memory issues.
    mimeType: text/plain
    handler:
      type: system_stats
