tools:
  - name: operate_control
    description: Send a command to a specific Loxone control by its UUID
    parameters:
      - name: control_id
        type: string
        description: The UUID of the control to operate
        required: true
      - name: action
        type: string
        description: Action to perform
        required: true
        enum: ["on", "off", "toggle", "up", "down", "stop"]
      - name: value
        type: number
        description: Optional value for the action
        required: false
    handler:
      type: operate_control

  - name: operate_controls_by_room
    description: Send a command to all Loxone controls of a specific type in a room
    parameters:
      - name: room
        type: string
        description: Name of the room
        required: true
      - name: action
        type: string
        description: Action to perform on all controls
        required: true
        enum: ["on", "off", "up", "down", "stop"]
      - name: control_type
        type: string
        description: Optional control type filter (e.g. LightController, Jalousie)
        required: false
      - name: include_states
        type: boolean
        description: Include current state values in the response
        required: false
        default: false
    handler:
      type: operate_controls_by_room

  - name: operate_controls_by_type
    description: Send a command to all Loxone controls of a specific type
    parameters:
      - name: control_type
        type: string
        description: Type of controls to operate (e.g. LightController, Jalousie)
        required: true
      - name: action
        type: string
        description: Action to perform
        required: true
        enum: ["on", "off", "up", "down", "stop"]
      - name: include_states
        type: boolean
        description: Include current state values in the response
        required: false
        default: false
    handler:
      type: operate_controls_by_type

  - name: operate_controls_by_category
    description: Send a command to all Loxone controls in a specific category
    parameters:
      - name: category
        type: string
        description: Category name
        required: true
      - name: action
        type: string
        description: Action to perform
        required: true
        enum: ["on", "off", "up", "down", "stop"]
      - name: include_states
        type: boolean
        description: Include current state values in the response
        required: false
        default: false
    handler:
      type: operate_controls_by_category

  - name: list_devices
    description: List physical Loxone hardware devices (Miniserver and Extensions)
    parameters:
      - name: name
        type: string
        description: Filter by device name (case-insensitive substring match)
        required: false
      - name: serial
        type: string
        description: Filter by serial number (exact match)
        required: false
      - name: version
        type: string
        description: Filter by firmware version (substring match)
        required: false
      - name: type
        type: string
        description: Filter by device type (Miniserver or Extension, case-insensitive)
        required: false
      - name: online_only
        type: boolean
        description: If true, only return online devices
        required: false
        default: false
    handler:
      type: list_physical_devices

  - name: send_control_command
    description: Send a raw command to a Loxone control by UUID
    parameters:
      - name: control
        type: string
        description: The UUID of the control to target
        required: true
      - name: action
        type: string
        description: The action or command to send
        required: true
    handler:
      type: generic_command
      commandTemplate: "/jdev/sps/io/{control}/{action}"

resources:
  - uri: "loxone://structure/summary"
    name: Loxone Structure Summary
    description: Overview of the entire Loxone system structure including control and room counts
    mimeType: application/json
    handler:
      type: structure_summary

  - uri: "loxone://rooms"
    name: All Rooms
    description: List of all rooms in the Loxone system
    mimeType: application/json
    handler:
      type: rooms_list

  - uri: "loxone://rooms/{roomName}/devices"
    name: Room Controls
    description: List all Loxone controls in a specific room (URI path uses "/devices" for backward compatibility)
    mimeType: application/json
    handler:
      type: room_devices

  - uri: "loxone://devices/all"
    name: All Controls
    description: Complete list of all Loxone controls in the system
    mimeType: application/json
    handler:
      type: devices_all

  - uri: "loxone://devices/type/{deviceType}"
    name: Controls by Type
    description: List all Loxone controls of a specific type
    mimeType: application/json
    handler:
      type: devices_by_type

  - uri: "loxone://devices/category/{categoryName}"
    name: Controls by Category
    description: List all Loxone controls in a specific category
    mimeType: application/json
    handler:
      type: devices_by_category

  - uri: "loxone://categories"
    name: All Categories
    description: List of all categories in the Loxone system
    mimeType: application/json
    handler:
      type: categories_list

  - uri: "loxone://docs"
    name: Loxone Docs TOC
    description: Table of Contents for the Loxone Structure File documentation
    mimeType: application/json
    handler:
      type: docs_toc

  - uri: "loxone://docs/controls"
    name: Loxone Docs Controls
    description: Flat list of every control type documented
    mimeType: application/json
    handler:
      type: docs_controls

  - uri: "loxone://docs/topic/{name}"
    name: Loxone Docs Topic
    description: Full documentation for a named topic
    mimeType: application/json
    handler:
      type: docs_topic

  - uri: "loxone://devices/states"
    name: All Control States
    description: Get current state values for all Loxone controls
    mimeType: application/json
    handler:
      type: all_device_states

  - uri: "loxone://devices/{deviceUuid}/state"
    name: Control State
    description: Get current state values for a specific Loxone control
    mimeType: application/json
    handler:
      type: device_state

  - uri: "loxone://statistics"
    name: Control Statistics
    description: Fetch historical statistics for one or more Loxone controls
    mimeType: application/json
    handler:
      type: statistics

  - uri: "loxone://webservices"
    name: Loxone Webservices
    description: Available Loxone Miniserver HTTP API webservice commands organized by category
    mimeType: application/json
    handler:
      type: webservices
